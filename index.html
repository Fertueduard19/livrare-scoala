<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Documente livrare școli – La Marilena Axpatis</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1d2621;--mut:#6b746f;--line:#e2ddd2;--acc:#1f6b4f;--acc2:#e9f3ee;--warn:#b4442f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:150px}
header{padding:18px 16px 6px;max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
header h1{font-size:20px;margin:0}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
main{max-width:720px;margin:auto;padding:0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 10px;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 3px}
input,select{width:100%;font:inherit;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--acc);border-color:transparent}
input:disabled{background:#f6f4ef;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{margin-bottom:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);margin:4px 0 0}
.chk input{width:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#eeeae1;border-radius:12px;padding:4px;gap:4px}
.seg button{background:none;padding:10px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fcfbf8}
.item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:600;font-size:14px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3>.lotc{grid-column:1/-1}
.lotw{display:flex;gap:6px}.lotw input{min-width:0}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.ghost{background:var(--acc2);color:var(--acc);font-weight:600}
.tiny{padding:6px 10px;font-size:13px}
.x{background:none;color:var(--warn);font-size:13px;padding:4px 6px}
.total{font-size:14px;margin:4px 0 10px;color:var(--mut)}.total b{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,241,234,.97);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.bar .lbl{grid-column:1/-1;font-size:12px;color:var(--mut);text-align:center}
.bar .all{grid-column:1/-1}
.pri{background:var(--acc);color:#fff;font-weight:700}
.sec{background:#fff;border:1px solid var(--line);font-weight:600;padding:9px 6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#1d2621;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;z-index:5}
.toast.on{opacity:1}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.hist .m{color:var(--mut);font-size:12px}
.muted{color:var(--mut);font-size:13px}
.warn{color:var(--warn);font-size:13px;margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--acc2);color:var(--acc);font-weight:600;margin-left:4px}
.pill.s{background:#e8eef8;color:#2d5596}
</style>
</head>
<body>
<header>
  <div><h1>Documente livrare școli</h1><p>LA MARILENA AXPATIS SRL</p></div>
  <button type="button" class="ghost tiny" id="bNew">+ Livrare nouă</button>
</header>
<main>
<form id="f" autocomplete="off" onsubmit="return false">
  <section class="card">
    <h2>Ce livrezi</h2>
    <div class="seg" id="tip"><button type="button" data-t="cald" class="on">🍲 Mâncare caldă</button><button type="button" data-t="sandv">🥪 Sandvișuri</button></div>
  </section>

  <section class="card">
    <h2>Beneficiar și contract</h2>
    <div class="f"><label>Data documentelor</label><input id="data" type="date"></div>
    <div class="f"><label>Beneficiar (școala)</label><input id="benef" list="dlSchools" placeholder="Școala Gimnazială Barcea nr. 1"></div>
    <div class="f"><label>Adresa livrării</label><input id="adresa" list="dlSchools">
      <label class="chk"><input type="checkbox" id="same" checked> aceeași cu beneficiarul</label></div>
    <div class="g2">
      <div class="f"><label>Contract / comandă nr.</label><input id="contract"></div>
      <div class="f"><label>Contract din data</label><input id="cdata" type="date"></div>
    </div>
  </section>

  <section class="card">
    <h2>Numere documente</h2>
    <div class="g2">
      <div class="f"><label>Nr. certificat</label><input id="nr" inputmode="numeric"></div>
      <div class="f"><label>Nr. proces-verbal</label><input id="pvnr" inputmode="numeric"></div>
      <div class="f"><label>Serie aviz</label><input id="serie" placeholder="ex. LMA"></div>
      <div class="f"><label>Nr. aviz</label><input id="aviz" inputmode="numeric"></div>
    </div>
    <p class="muted" style="margin:0">Numerele cresc singure după fiecare livrare salvată.</p>
  </section>

  <section class="card">
    <h2 id="itemsTitle">Preparate livrate</h2>
    <div id="items"></div>
    <p class="total" id="total"></p>
    <div class="actions">
      <button type="button" class="ghost" id="addItem">+ Adaugă</button>
      <button type="button" class="ghost" id="lastMenu">Copiază ultima livrare de acest tip</button>
    </div>
  </section>

  <section class="card">
    <h2>Preparare, transport, livrare</h2>
    <div class="g2">
      <div class="f"><label>Data preparării</label><input id="dprep" type="date"></div>
      <div class="f"><label>Ora preparării</label><input id="oprep" type="time"></div>
      <div class="f"><label>Data livrării</label><input id="dliv" type="date"></div>
      <div class="f"><label>Ora expedierii (plecare)</label><input id="oexp" type="time"></div>
      <div class="f"><label>Ora livrării (predare)</label><input id="oliv" type="time"></div>
      <div class="f"><label>Temperatura la expediere (°C)</label><input id="temp" inputmode="decimal" placeholder="ex. 72"></div>
    </div>
    <p class="warn" id="tempWarn" style="display:none"></p>
    <div class="f" style="margin-top:8px"><label>Delegat / șofer (predat de)</label><input id="delegat"></div>
  </section>

  <section class="card">
    <h2>Istoric livrări</h2>
    <ul class="hist" id="hist"></ul>
    <p class="muted" id="store"></p>
    <div class="actions"><button type="button" class="ghost tiny" id="bExp">Salvează copie de siguranță</button><button type="button" class="ghost tiny" id="bImp">Încarcă copie</button><input type="file" id="fImp" accept=".json,application/json" hidden></div>
  </section>
</form>
</main>

<div class="bar"><div class="in">
  <div class="lbl">Descarcă în Word</div>
  <button class="sec" data-doc="cert">Certificat</button>
  <button class="sec" data-doc="aviz">Aviz</button>
  <button class="sec" data-doc="pv">Proces-verbal</button>
  <button class="pri all" id="bAll">Toate 3 documentele (.zip)</button>
</div></div>
<div class="toast" id="toast"></div>
<datalist id="dlSchools"></datalist>
<datalist id="dlDishes"></datalist>

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const ro=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-');return d+'.'+m+'.'+y};
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2800)};
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEF_DELEGAT='Maros Alexandru-Ionuț';

/* ---------- state & storage ---------- */
const LSK='certif-marilena-v1';
const blankState=()=>({v:2,nextNr:1,nextPv:1,nextAviz:1,serie:'',delegat:DEF_DELEGAT,dishes:{},schools:[],last:null,lastBy:{},history:[]});
let S=blankState();

function migrate(o){o=Object.assign(blankState(),o);
  o.history=(o.history||[]).map(h=>Object.assign({id:h.id||('old'+h.nr),tip:h.tip||'cald'},h));
  if(o.last&&!o.lastBy.cald)o.lastBy.cald=o.last; return o}
function lsLoad(){try{const v=localStorage.getItem(LSK);if(v)S=migrate(JSON.parse(v))}catch(e){}}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}}
function persist(){lsSave()}
/* ---------- tip ---------- */
let tip='cald', curId=null;
function setTip(t){tip=t;document.querySelectorAll('#tip button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('itemsTitle').textContent=t==='cald'?'Preparate livrate':'Sandvișuri livrate';
  $('temp').placeholder=t==='cald'?'ex. 72':'ex. 3';
  renderItems();checkTemp()}
$('tip').addEventListener('click',e=>{const b=e.target.closest('button');if(b){setTip(b.dataset.t);dirty=true}});

/* ---------- items ---------- */
let items=[];
const U=()=>tip==='cald'?{q:'Porții',g:'Gramaj / porție (g)',ph:'ex. Supă de legume'}:{q:'Pachete',g:'Gramaj / buc. (g)',ph:'ex. Sandviș cu șuncă și cașcaval'};
function itemHTML(it,i){const u=U();return `<div class="item" data-i="${i}">
  <div class="top"><span>${tip==='cald'?'Preparat':'Produs'} ${i+1}</span><button type="button" class="x" data-del="${i}">Șterge</button></div>
  <div class="f"><label>Denumire</label><input data-k="den" list="dlDishes" value="${esc(it.den)}" placeholder="${u.ph}"></div>
  <div class="row3">
    <div><label>${u.q}</label><input data-k="por" inputmode="numeric" value="${esc(it.por)}"></div>
    <div><label>${u.g}</label><input data-k="gr" inputmode="numeric" value="${esc(it.gr)}"></div>
    <div class="lotc"><label>Lot / identificare</label><div class="lotw"><input data-k="lot" value="${esc(it.lot)}"><button type="button" class="ghost tiny" data-lot="${i}">Auto</button></div></div>
  </div></div>`}
function renderItems(){$('items').innerHTML=items.map(itemHTML).join('');renderTotal()}
function readItems(){document.querySelectorAll('.item').forEach(el=>{const i=+el.dataset.i;el.querySelectorAll('[data-k]').forEach(inp=>items[i][inp.dataset.k]=inp.value.trim())})}
const sumPor=list=>list.reduce((a,it)=>a+(parseInt(it.por,10)||0),0);
function renderTotal(){const t=sumPor(items);$('total').innerHTML=t?`Total ${tip==='cald'?'porții':'pachete'}: <b>${t}</b>`:''}
function autoLot(i){const d=($('dprep').value||todayISO()).split('-');return (tip==='cald'?'L':'S')+d[2]+d[1]+d[0].slice(2)+'-'+(i+1)}
$('items').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;readItems();
  if(k==='den'){const g=S.dishes[e.target.value.trim()];const box=e.target.closest('.item');const i=+box.dataset.i;
    if(g&&!items[i].gr){items[i].gr=g;box.querySelector('[data-k=gr]').value=g}}
  if(k==='por')renderTotal()});
$('items').addEventListener('click',e=>{const d=e.target.dataset;
  if(d.del!==undefined){readItems();items.splice(+d.del,1);if(!items.length)items.push({});renderItems()}
  if(d.lot!==undefined){readItems();items[+d.lot].lot=autoLot(+d.lot);renderItems()}});
$('addItem').onclick=()=>{readItems();items.push({por:items[0]?.por||''});renderItems()};
$('lastMenu').onclick=()=>{const L=S.lastBy[tip];if(!L){toast('Nu există încă o livrare de acest tip');return}
  items=L.items.map((it,i)=>({den:it.den,por:it.por,gr:it.gr,lot:it.lot?autoLot(i):''}));renderItems();dirty=true;toast('Am copiat lista – verifică cantitățile')};

/* ---------- form ---------- */
const FIELDS=['data','benef','adresa','contract','cdata','nr','pvnr','serie','aviz','dprep','oprep','dliv','oexp','oliv','temp','delegat'];
function syncAddr(){if($('same').checked){$('adresa').value=$('benef').value;$('adresa').disabled=true}else $('adresa').disabled=false}
$('same').onchange=syncAddr;$('benef').addEventListener('input',syncAddr);
function checkTemp(){const t=parseFloat($('temp').value.replace(',','.'));let m='';
  if(!isNaN(t)){if(tip==='cald'&&t<60)m='Atenție: preparatele calde trebuie să fie la minimum +60°C.';if(tip==='sandv'&&(t<2||t>4))m='Atenție: sandvișurile se transportă la +2°C … +4°C.'}
  $('tempWarn').textContent=m;$('tempWarn').style.display=m?'block':'none'}
$('temp').addEventListener('input',checkTemp);
$('dprep').addEventListener('change',()=>{if($('dliv').dataset.auto){$('dliv').value=$('dprep').value}});
$('dliv').addEventListener('change',()=>delete $('dliv').dataset.auto);
let dirty=false;$('f').addEventListener('input',()=>dirty=true);

function newForm(t){
  t=t||(S.history.length?S.history[S.history.length-1].tip:'cald');
  const d=todayISO(),L=S.lastBy[t]||S.last||{};
  curId=null;
  $('data').value=d;$('benef').value=L.benef||'';$('same').checked=!L.adresa||L.adresa===L.benef;$('adresa').value=L.adresa||'';
  $('contract').value=L.contract||'';$('cdata').value=L.cdata||'';
  $('nr').value=S.nextNr;$('pvnr').value=S.nextPv;$('serie').value=S.serie||'';$('aviz').value=S.nextAviz;
  $('dprep').value=d;$('dliv').value=d;$('dliv').dataset.auto=1;
  $('oprep').value=L.oprep||'';$('oexp').value=L.oexp||'';$('oliv').value=L.oliv||'';$('temp').value='';
  $('delegat').value=S.delegat||DEF_DELEGAT;
  items=[{}];tip=t;setTip(t);syncAddr();fillLists();renderHist();dirty=false;window.scrollTo({top:0});
}
$('bNew').onclick=()=>{newForm();toast('Livrare nouă')};
function collect(){readItems();syncAddr();const v={id:curId||uid(),tip};FIELDS.forEach(k=>v[k]=$(k).value.trim());
  v.items=items.filter(it=>it.den||it.por||it.gr||it.lot).map(it=>({den:it.den||'',por:it.por||'',gr:it.gr||'',lot:it.lot||''}));return v}
function loadInto(v,asNew){
  FIELDS.forEach(k=>$(k).value=v[k]||'');if(!v.delegat)$('delegat').value=S.delegat||DEF_DELEGAT;
  $('same').checked=v.adresa===v.benef;delete $('dliv').dataset.auto;
  items=(v.items&&v.items.length?v.items:[{}]).map(x=>Object.assign({},x));tip=v.tip||'cald';
  curId=asNew?null:v.id;
  if(asNew){const d=todayISO();$('data').value=d;$('dprep').value=d;$('dliv').value=d;$('dliv').dataset.auto=1;$('temp').value='';
    $('nr').value=S.nextNr;$('pvnr').value=S.nextPv;$('aviz').value=S.nextAviz;$('serie').value=S.serie||v.serie||'';
    items.forEach((it,i)=>{if(it.lot)it.lot=autoLot(i)})}
  setTip(tip);syncAddr();checkTemp();window.scrollTo({top:0,behavior:'smooth'});
}
function fillLists(){$('dlSchools').innerHTML=S.schools.map(s=>`<option value="${esc(s)}">`).join('');
  $('dlDishes').innerHTML=Object.keys(S.dishes).sort().map(s=>`<option value="${esc(s)}">`).join('')}
function renderHist(){const h=S.history.slice(-40).reverse(),N=S.history.length;
  $('hist').innerHTML=h.length?h.map((v,j)=>`<li><div><b>${esc(ro(v.data))}</b><span class="pill ${v.tip==='sandv'?'s':''}">${v.tip==='sandv'?'sandvișuri':'mâncare caldă'}</span>
    <div class="m">${esc(v.benef||'—')} · Cert. ${esc(v.nr)} · Aviz ${esc(v.aviz)} · PV ${esc(v.pvnr)} · ${sumPor(v.items)} ${v.tip==='sandv'?'pachete':'porții'}</div></div>
    <div class="actions"><button type="button" class="ghost tiny" data-open="${N-1-j}">Deschide</button><button type="button" class="ghost tiny" data-dup="${N-1-j}">Copie nouă</button></div></li>`).join('')
    :'<li class="muted">Nicio livrare încă. După primul document descărcat, livrarea apare aici.</li>'}
$('hist').addEventListener('click',e=>{const d=e.target.dataset;
  if(d.open!==undefined){loadInto(S.history[+d.open],false);dirty=true;toast('Livrarea a fost încărcată')}
  if(d.dup!==undefined){loadInto(S.history[+d.dup],true);dirty=true;toast('Copie nouă cu data de azi și numere noi')}});

function record(v){
  const idx=S.history.findIndex(h=>h.id===v.id);const entry=Object.assign({savedAt:new Date().toISOString()},v);
  if(idx>=0)S.history[idx]=entry;else S.history.push(entry);
  if(S.history.length>400)S.history=S.history.slice(-400);
  const bump=(k,val)=>{const n=parseInt(val,10);if(!isNaN(n)&&n>=S[k])S[k]=n+1};
  bump('nextNr',v.nr);bump('nextPv',v.pvnr);bump('nextAviz',v.aviz);
  S.serie=v.serie;S.delegat=v.delegat||DEF_DELEGAT;
  v.items.forEach(it=>{if(it.den&&it.gr)S.dishes[it.den]=it.gr});
  [v.benef,v.adresa].forEach(s=>{if(s&&!S.schools.includes(s))S.schools.push(s)});
  S.lastBy[v.tip]={benef:v.benef,adresa:v.adresa,contract:v.contract,cdata:v.cdata,oprep:v.oprep,oexp:v.oexp,oliv:v.oliv,items:v.items};
  S.last=S.lastBy[v.tip];
  curId=v.id;persist();fillLists();renderHist();dirty=false;
}
function validate(v){
  if(!v.items.length){toast('Adaugă cel puțin un produs');return false}
  if(!v.benef){toast('Completează beneficiarul');return false}
  return true}

/* ---------- documents ---------- */
function docVals(v,doc){
  const B=n=>'_'.repeat(n),or=(x,n)=>x?x:B(n);
  let dataTxt='____ / ____ / ______';if(v.data){const [y,m,d]=v.data.split('-');dataTxt=d+' / '+m+' / '+y}
  const avizFull=v.aviz?((v.serie?v.serie+' ':'')+v.aviz):'';
  const tot=sumPor(v.items),um=v.tip==='sandv'?'pachete':'porții';
  let exp=[ro(v.dliv||v.data),v.oexp].filter(Boolean).join(', ora ');
  return {NR:or(v.nr,10),DATA:dataTxt,DATAR:or(ro(v.data),14),BENEF:or(v.benef,30),ADRESA:or(v.adresa,30),
    CONTRACT:or(v.contract,doc==='pv'?10:20),CDATA:or(ro(v.cdata),10),SERIE:or(v.serie,10),AVIZ:or(v.aviz,10),AVIZFULL:or(avizFull,doc==='pv'?10:20),PVNR:or(v.pvnr,10),
    DPREP:or(ro(v.dprep),14),OPREP:or(v.oprep,10),DLIV:or(ro(v.dliv),14),OLIV:or(v.oliv,10),TEMP:or(v.temp,6),
    TOTAL:tot?tot+' '+um:B(12),EXPED:or(exp,24),DELEGAT:or(v.delegat,24),
    rows:v.items.map((it,i)=>({R_NR:i+1,R_DEN:or(it.den,24),R_POR:or(it.por,6),R_GR:or(it.gr,6),R_LOT:or(it.lot,10),R_UM:um}))}
}
const xmlEsc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fill=(t,o)=>t.replace(/\{\{(\w+)\}\}/g,(m,k)=>k in o?xmlEsc(o[k]):'');
async function makeDocx(v,doc,as){
  const key=doc==='cert'?v.tip:doc,D=docVals(v,doc);
  const zip=await JSZip.loadAsync(TPL[key],{base64:true});
  let xml=await zip.file('word/document.xml').async('string');
  const m=xml.match(/<!--ROW-->([\s\S]*?)<!--\/ROW-->/);
  xml=xml.replace(m[0],D.rows.map(r=>fill(m[1],r)).join(''));
  xml=fill(xml,D);zip.file('word/document.xml',xml);
  return zip.generateAsync({type:as||'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const NAMES={cert:'Certificat_conformitate',aviz:'Aviz_insotire',pv:'Proces_verbal_receptie'};
const day=v=>(ro(v.data)||'fara-data').replace(/\./g,'-');
const fname=(v,doc)=>{const n=doc==='cert'?v.nr:doc==='aviz'?v.aviz:v.pvnr;return `${NAMES[doc]}${v.tip==='sandv'&&doc==='cert'?'_sandvisuri':''}_nr${String(n||'').replace(/[^\w-]/g,'')}_${day(v)}.docx`};
async function offer(name,blob){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);return true}catch(e){toast('Nu am putut descărca fișierul');return false}
}
document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=async()=>{const v=collect();if(!validate(v))return;const doc=b.dataset.doc;
  try{const blob=await makeDocx(v,doc);if(await offer(fname(v,doc),blob)){record(v);toast('Gata – '+b.textContent+' descărcat. Livrarea e salvată.')}}catch(e){console.error(e);toast('Eroare la generarea documentului')}});
$('bAll').onclick=async()=>{const v=collect();if(!validate(v))return;
  try{const z=new JSZip();for(const doc of ['cert','aviz','pv'])z.file(fname(v,doc),await makeDocx(v,doc,'uint8array'));
    const blob=await z.generateAsync({type:'blob'});
    if(await offer(`Documente_livrare_${(v.benef||'scoala').replace(/[^\wăâîșțĂÂÎȘȚ-]+/g,'_').slice(0,40)}_${day(v)}.zip`,blob)){record(v);toast('Gata – cele 3 documente au fost descărcate')}}
  catch(e){console.error(e);toast('Eroare la generarea documentelor')}};

/* ---------- start ---------- */
lsLoad();newForm();
$('store').textContent='Datele se salvează pe acest dispozitiv. Ca să le muți pe alt telefon sau pe PC, folosește copia de siguranță.';
$('bExp').onclick=()=>{offer('backup_documente_livrare_'+todayISO()+'.json',new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));toast('Copia de siguranță a fost descărcată')};
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const o=JSON.parse(await f.text());if(!o||!Array.isArray(o.history))throw 0;
    S=migrate(o);lsSave();newForm();toast('Copia a fost încărcată: '+S.history.length+' livrări')}catch(err){toast('Fișierul nu este o copie validă')}
  e.target.value=''};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
